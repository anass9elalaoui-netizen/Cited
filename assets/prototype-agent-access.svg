<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="How a client AI agent reaches research through the Cited MCP gateway: entitled content passes with citations, non-entitled content is blocked, every call is audited.">
  <style>.t{font-family:Inter,Helvetica,Arial,sans-serif}.h{font-weight:700}</style>
  <rect width="1200" height="420" rx="18" fill="#0E1726"/>
  <text x="40" y="52" class="t h" font-size="20" fill="#FFFFFF">Client AI agents read research through one governed door</text>
  <text x="40" y="78" class="t" font-size="13.5" fill="#9FB3C8">Entitlements are checked before retrieval, so a model never sees what the client may not read.</text>

  <!-- agents -->
  <g class="t">
    <rect x="40" y="120" width="230" height="58" rx="12" fill="#16263D" stroke="#2B3F5C"/>
    <text x="60" y="155" font-size="14" fill="#E2E8F0">Client A · Copilot agent</text>
    <rect x="40" y="196" width="230" height="58" rx="12" fill="#16263D" stroke="#2B3F5C"/>
    <text x="60" y="231" font-size="14" fill="#E2E8F0">Client B · Claude agent</text>
    <rect x="40" y="272" width="230" height="58" rx="12" fill="#16263D" stroke="#2B3F5C"/>
    <text x="60" y="307" font-size="14" fill="#E2E8F0">Client C · in-house agent</text>
  </g>
  <g stroke="#3B82F6" stroke-width="2" fill="none">
    <path d="M270 149 C 330 149, 330 225, 390 225"/>
    <path d="M270 225 L 390 225"/>
    <path d="M270 301 C 330 301, 330 225, 390 225"/>
  </g>
  <text x="330" y="212" class="t" font-size="11" fill="#7F93A8" text-anchor="middle">MCP</text>

  <!-- gateway -->
  <rect x="390" y="150" width="300" height="150" rx="16" fill="#1E3A8A" stroke="#3B82F6" stroke-width="2"/>
  <text x="540" y="186" class="t h" font-size="17" fill="#FFFFFF" text-anchor="middle">Cited gateway</text>
  <g class="t" font-size="12.5" fill="#DBEAFE">
    <text x="414" y="218">1  identify client</text>
    <text x="414" y="240">2  resolve entitlements</text>
    <text x="414" y="262">3  filtered retrieval</text>
    <text x="414" y="284">4  cite, mask, log</text>
  </g>

  <!-- outcomes -->
  <g stroke-width="2" fill="none">
    <path d="M690 190 C 750 190, 760 140, 820 140" stroke="#22C55E"/>
    <path d="M690 260 C 750 260, 760 300, 820 300" stroke="#EF4444" stroke-dasharray="6 5"/>
  </g>
  <rect x="820" y="104" width="340" height="72" rx="12" fill="#052E1A" stroke="#22C55E"/>
  <text x="840" y="133" class="t h" font-size="14" fill="#86EFAC">Entitled note → passages + citations</text>
  <text x="840" y="156" class="t" font-size="12" fill="#BBF7D0">note id · section · publish time · analyst</text>
  <rect x="820" y="264" width="340" height="72" rx="12" fill="#3B0D0D" stroke="#EF4444"/>
  <text x="840" y="293" class="t h" font-size="14" fill="#FCA5A5">Not entitled → nothing returned</text>
  <text x="840" y="316" class="t" font-size="12" fill="#FECACA">clear refusal, never a model guess</text>

  <!-- audit -->
  <rect x="390" y="330" width="300" height="52" rx="12" fill="#16263D" stroke="#2B3F5C"/>
  <text x="540" y="361" class="t" font-size="13" fill="#C9D6E3" text-anchor="middle">Audit trail → research usage dashboard</text>
  <line x1="540" y1="300" x2="540" y2="330" stroke="#7F93A8" stroke-width="2"/>
</svg>
