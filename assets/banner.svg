<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Cited. Every answer has a source. Every source has an owner.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1726"/>
      <stop offset="1" stop-color="#16263D"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <!-- chain of sources -->
  <g stroke="#3B82F6" stroke-width="2" fill="none" opacity="0.9">
    <line x1="760" y1="150" x2="850" y2="150"/>
    <line x1="890" y1="150" x2="980" y2="150"/>
    <line x1="1020" y1="150" x2="1110" y2="150"/>
  </g>
  <g fill="#0E1726" stroke="#3B82F6" stroke-width="2.5">
    <circle cx="740" cy="150" r="20"/>
    <circle cx="870" cy="150" r="20"/>
    <circle cx="1000" cy="150" r="20"/>
  </g>
  <circle cx="1130" cy="150" r="22" fill="#3B82F6"/>
  <g font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#9FB3C8" text-anchor="middle">
    <text x="740" y="196">source</text>
    <text x="870" y="196">entitlement</text>
    <text x="1000" y="196">citation</text>
    <text x="1130" y="198">answer</text>
  </g>
  <g font-family="Inter, Helvetica, Arial, sans-serif">
    <text x="80" y="140" font-size="64" font-weight="700" fill="#FFFFFF">Cited</text>
    <text x="80" y="185" font-size="22" fill="#C9D6E3">Every answer has a source. Every source has an owner.</text>
    <text x="80" y="225" font-size="15" fill="#7F93A8">Entitled research for the AI-agent era · design study</text>
  </g>
</svg>
