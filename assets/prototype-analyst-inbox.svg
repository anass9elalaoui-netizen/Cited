<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Prototype of the Cited analyst inbox: triaged client requests on the left, a cited draft reply on the right with approve, edit and reject buttons.">
  <style>
    .t{font-family:Inter,Helvetica,Arial,sans-serif}
    .h{font-weight:700}
    .m{fill:#64748B}
  </style>
  <rect width="1200" height="720" rx="18" fill="#F1F5F9"/>
  <!-- window -->
  <rect x="24" y="24" width="1152" height="672" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <!-- top bar -->
  <rect x="24" y="24" width="1152" height="56" rx="14" fill="#0E1726"/>
  <rect x="24" y="66" width="1152" height="14" fill="#0E1726"/>
  <circle cx="54" cy="52" r="10" fill="#3B82F6"/>
  <text x="74" y="58" class="t h" font-size="17" fill="#FFFFFF">Cited</text>
  <text x="140" y="58" class="t" font-size="14" fill="#9FB3C8">Analyst inbox · Europe Banks desk</text>
  <rect x="930" y="38" width="226" height="28" rx="14" fill="#16263D"/>
  <circle cx="948" cy="52" r="5" fill="#22C55E"/>
  <text x="960" y="57" class="t" font-size="13" fill="#C9D6E3">Synthetic Analyst 3 · online</text>

  <!-- left list -->
  <rect x="24" y="80" width="400" height="616" fill="#F8FAFC"/>
  <line x1="424" y1="80" x2="424" y2="696" stroke="#E2E8F0"/>
  <text x="48" y="116" class="t h" font-size="15" fill="#0F172A">Client requests</text>
  <text x="48" y="138" class="t m" font-size="12">Triaged by AI · routed to you</text>

  <!-- item 1 selected -->
  <rect x="40" y="156" width="368" height="104" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  <rect x="56" y="172" width="86" height="22" rx="11" fill="#DBEAFE"/>
  <text x="99" y="187" class="t" font-size="11" fill="#1D4ED8" text-anchor="middle">Research Q</text>
  <rect x="150" y="172" width="58" height="22" rx="11" fill="#FEE2E2"/>
  <text x="179" y="187" class="t" font-size="11" fill="#B91C1C" text-anchor="middle">Urgent</text>
  <text x="392" y="187" class="t m" font-size="11" text-anchor="end">09:42</text>
  <text x="56" y="216" class="t h" font-size="14" fill="#0F172A">Client A · Long-only fund</text>
  <text x="56" y="238" class="t" font-size="12.5" fill="#334155">House view on EU bank margins after Q3?</text>

  <!-- item 2 -->
  <rect x="40" y="272" width="368" height="104" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="56" y="288" width="96" height="22" rx="11" fill="#DCFCE7"/>
  <text x="104" y="303" class="t" font-size="11" fill="#15803D" text-anchor="middle">Data request</text>
  <text x="392" y="303" class="t m" font-size="11" text-anchor="end">09:15</text>
  <text x="56" y="332" class="t h" font-size="14" fill="#0F172A">Client C · Hedge fund</text>
  <text x="56" y="354" class="t" font-size="12.5" fill="#334155">Latest EPS estimates for ticker BNK1</text>

  <!-- item 3 -->
  <rect x="40" y="388" width="368" height="104" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="56" y="404" width="70" height="22" rx="11" fill="#FEF3C7"/>
  <text x="91" y="419" class="t" font-size="11" fill="#B45309" text-anchor="middle">Meeting</text>
  <text x="392" y="419" class="t m" font-size="11" text-anchor="end">Yesterday</text>
  <text x="56" y="448" class="t h" font-size="14" fill="#0F172A">Client B · Pension fund</text>
  <text x="56" y="470" class="t" font-size="12.5" fill="#334155">Call with the analyst next week?</text>

  <!-- stats -->
  <rect x="40" y="516" width="368" height="160" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="56" y="544" class="t h" font-size="13" fill="#0F172A">This week</text>
  <text x="56" y="586" class="t h" font-size="26" fill="#0F172A">42</text>
  <text x="56" y="606" class="t m" font-size="11.5">requests triaged</text>
  <text x="186" y="586" class="t h" font-size="26" fill="#0F172A">31</text>
  <text x="186" y="606" class="t m" font-size="11.5">drafts approved</text>
  <text x="300" y="586" class="t h" font-size="26" fill="#16A34A">0</text>
  <text x="300" y="606" class="t m" font-size="11.5">entitlement leaks</text>
  <text x="56" y="652" class="t" font-size="11" fill="#94A3B8">Illustrative prototype data, not measured results</text>

  <!-- right: request + draft -->
  <text x="456" y="116" class="t h" font-size="18" fill="#0F172A">House view on EU bank margins after Q3?</text>
  <text x="456" y="140" class="t m" font-size="12.5">From Client A · entitled: Europe Banks (sector + update notes) · channel: email</text>

  <rect x="456" y="160" width="696" height="88" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="476" y="188" class="t" font-size="13" fill="#334155">"Hi, after the Q3 numbers, do you still think net interest margins</text>
  <text x="476" y="208" class="t" font-size="13" fill="#334155">have peaked for the large EU banks? Which names look most exposed?"</text>
  <text x="476" y="232" class="t m" font-size="11.5">Triage: research question · tickers: sector · urgency: high · confidence 0.93</text>

  <text x="456" y="282" class="t h" font-size="14" fill="#0F172A">AI draft</text>
  <rect x="520" y="268" width="150" height="20" rx="10" fill="#DCFCE7"/>
  <text x="595" y="282" class="t" font-size="11" fill="#15803D" text-anchor="middle">3/3 sentences cited</text>

  <rect x="456" y="298" width="696" height="210" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="476" y="330" class="t" font-size="13.5" fill="#0F172A">Our view is unchanged: we think margins have passed their peak and</text>
  <text x="476" y="351" class="t" font-size="13.5" fill="#0F172A">will ease gradually as deposit costs catch up.</text>
  <rect x="823" y="337" width="34" height="19" rx="5" fill="#DBEAFE"/>
  <text x="840" y="351" class="t h" font-size="11" fill="#1D4ED8" text-anchor="middle">[1]</text>
  <text x="476" y="386" class="t" font-size="13.5" fill="#0F172A">The names most exposed are those with the highest share of variable-</text>
  <text x="476" y="407" class="t" font-size="13.5" fill="#0F172A">rate loans, as set out in our sensitivity table.</text>
  <rect x="757" y="393" width="34" height="19" rx="5" fill="#DBEAFE"/>
  <text x="774" y="407" class="t h" font-size="11" fill="#1D4ED8" text-anchor="middle">[2]</text>
  <text x="476" y="442" class="t" font-size="13.5" fill="#0F172A">Happy to set up a call with the analyst to go through the details.</text>
  <rect x="884" y="428" width="34" height="19" rx="5" fill="#DBEAFE"/>
  <text x="901" y="442" class="t h" font-size="11" fill="#1D4ED8" text-anchor="middle">[3]</text>
  <line x1="476" y1="464" x2="1132" y2="464" stroke="#F1F5F9"/>
  <text x="476" y="490" class="t m" font-size="11.5">Model: small (triage) + large (draft) · 1.8 s · cost tracked per request</text>

  <!-- sources -->
  <text x="456" y="540" class="t h" font-size="14" fill="#0F172A">Sources (all within Client A's entitlements)</text>
  <g class="t" font-size="12.5">
    <text x="456" y="568" fill="#1D4ED8">[1]</text><text x="486" y="568" fill="#334155">SYN-2026-0412 · European Banks: margins past the peak · section: thesis</text>
    <text x="456" y="592" fill="#1D4ED8">[2]</text><text x="486" y="592" fill="#334155">SYN-2026-0412 · section: rate sensitivity table</text>
    <text x="456" y="616" fill="#1D4ED8">[3]</text><text x="486" y="616" fill="#334155">Coverage table · covering analyst, Europe Banks</text>
  </g>

  <!-- actions -->
  <rect x="456" y="640" width="150" height="40" rx="10" fill="#16A34A"/>
  <text x="531" y="665" class="t h" font-size="14" fill="#FFFFFF" text-anchor="middle">Approve &amp; send</text>
  <rect x="618" y="640" width="96" height="40" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="666" y="665" class="t h" font-size="14" fill="#0F172A" text-anchor="middle">Edit</text>
  <rect x="726" y="640" width="96" height="40" rx="10" fill="#FFFFFF" stroke="#FCA5A5"/>
  <text x="774" y="665" class="t h" font-size="14" fill="#B91C1C" text-anchor="middle">Reject</text>
  <text x="1152" y="665" class="t m" font-size="11.5" text-anchor="end">Every action is written to the audit trail</text>
</svg>
